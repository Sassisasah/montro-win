name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Build-Nummer = Anzahl Commits (später)

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Bauen und veröffentlichen (eigenständig, win-x64)
        run: dotnet publish src/montro/montro.csproj -c Release -r win-x64 --self-contained true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: montro-win-x64
          path: publish
          if-no-files-found: error
