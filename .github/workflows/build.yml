name: Build

# Jeder Push: eigenständige App (Artefakt montro-win-x64) und Installer (Artefakt montro-msi).
# Tag v* (z. B. v0.7.0): zusätzlich GitHub-Release mit der MSI und einer ZIP der App.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Build-Nummer = Anzahl Commits (später)

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version aus montro.csproj
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/montro/montro.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Bauen und veröffentlichen (eigenständig, win-x64)
        run: dotnet publish src/montro/montro.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Installer bauen (WiX)
        run: dotnet build installer/montro.wixproj -c Release -p:ProductVersion=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: montro-win-x64
          path: publish
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: montro-msi
          path: installer/bin/Release/*.msi
          if-no-files-found: error

      - name: Release (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path publish/* -DestinationPath "montro-$v-win-x64.zip"
          $notes = (Get-Content CHANGELOG.md -Raw -Encoding UTF8) -split "(?m)^## " | Select-Object -Skip 1 -First 1
          gh release create "${{ github.ref_name }}" (Get-ChildItem installer/bin/Release/*.msi).FullName "montro-$v-win-x64.zip" --title "montro für Windows $v" --notes "## $notes"
